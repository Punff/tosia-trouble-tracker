<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tosia Trouble Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #d9dcb8; display: grid; place-items: center; }
  a { display: block; height: 96vh; max-width: 96vw; aspect-ratio: 600 / 820; }
  svg { width: 100%; height: 100%; }
  text { font-family: "Archivo Black", "Arial Black", sans-serif; fill: #222; }
  #days { fill: #c4161c; }
  .credit { position: fixed; right: 6px; bottom: 4px; font: 11px sans-serif; color: #888; }
  .credit a { display: inline; height: auto; color: inherit; }
</style>
</head>
<body>
<a href="https://github.com/Punff/tosia-trouble-tracker/actions/workflows/reset.yml" target="_blank" rel="noopener" aria-label="Days since Tosia's last accident">
  <svg viewBox="0 0 600 820">
    <rect x="30" y="20" width="540" height="225" rx="6" fill="#f4f1e6" stroke="#222" stroke-width="6"/>
    <rect x="215" y="40" width="170" height="112" fill="#fff" stroke="#222" stroke-width="5"/>
    <text id="days" x="300" y="134" text-anchor="middle" font-size="92">–</text>
    <text x="300" y="192" text-anchor="middle" font-size="32"><tspan id="unit">DAYS</tspan> SINCE TOSIA'S</text>
    <text x="300" y="230" text-anchor="middle" font-size="32">LAST ACCIDENT</text>
    <image href="beaver.png" x="100" y="275" width="438" height="542"/>
    <rect x="406" y="243" width="18" height="350" fill="#9b6a3a" stroke="#222" stroke-width="4"/>
  </svg>
</a>
<div class="credit">Beaver: <a href="https://commons.wikimedia.org/wiki/File:Beaver_cartoon.png">Cedelmwood</a>, CC BY-SA 4.0</div>
<script>
  const DAY = 86400000;
  const toDayNum = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / DAY; };
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / DAY;

  fetch("data.json?t=" + Date.now(), { cache: "no-store" })
    .then((r) => r.json())
    .then(({ incidents }) => {
      const last = incidents.map((i) => i.date).sort().pop();
      const days = Math.max(0, today - toDayNum(last));
      document.getElementById("days").textContent = days;
      document.getElementById("days").setAttribute("font-size", days >= 100 ? 70 : 92);
      document.getElementById("unit").textContent = days === 1 ? "DAY" : "DAYS";
    })
    .catch(() => { document.getElementById("days").textContent = "?"; });
</script>
</body>
</html>

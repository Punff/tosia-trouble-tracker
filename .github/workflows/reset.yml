name: Report an incident (reset counter)

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What did Tosia do this time?"
        required: true
        default: "Something. Again."
      date:
        description: "Incident date (YYYY-MM-DD). Leave blank for today."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: incident-log

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log the incident
        env:
          WHAT: ${{ inputs.what }}
          WHEN: ${{ inputs.date }}
        run: |
          if [ -z "$WHEN" ]; then WHEN=$(TZ=Europe/Zagreb date +%F); fi
          if ! [[ "$WHEN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -d "$WHEN" >/dev/null 2>&1; then
            echo "::error::Date must look like 2026-10-16, got '$WHEN'"; exit 1
          fi
          jq --arg d "$WHEN" --arg w "$WHAT" \
            '.incidents += [{date: $d, what: $w}] | .incidents |= sort_by(.date)' \
            data.json > data.tmp && mv data.tmp data.json
          git config user.name "Incident Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "D'oh! Incident on $WHEN: $WHAT"
          git push

  deploy:
    needs: reset
    uses: ./.github/workflows/deploy.yml
